- id: ISSUE-0007
  file: arch/x86/chunkset_avx512.c
  code_range: 14-43
  category: x64_neon_port_required
  arm64_target: chunkmemset_safe_neon
  arm64_file: arch/arm/chunkset_neon.c
  description: |-
    AVX512 safe chunk memory-set function generated via template (chunkset_tpl.h).
    chunk_t is __m256i (256-bit); ARM64 uses uint8x16_t (128-bit).
    Key intrinsic mappings:
      _mm256_set1_epi16/32/64x    -> vdupq_n_u16/u32/u64
      _mm256_loadu/storeu_si256   -> vld1q_u8 / vst1q_u8
      _mm256_broadcastsi128_si256 -> vcombine_u8(a, a)
      _mm256_shuffle_epi8         -> vqtbl1q_u8 (aarch64 only)
      _mm256_maskz_loadu_epi8     -> vld1q_u8 with manual masking
  context: |-
    typedef __m256i chunk_t;
    typedef __m128i halfchunk_t;
    typedef __mmask32 mask_t;
    typedef __mmask16 halfmask_t;

    #define HAVE_CHUNKMEMSET_2
    #define HAVE_CHUNKMEMSET_4
    #define HAVE_CHUNKMEMSET_8
    #define HAVE_CHUNKMEMSET_16
    #define HAVE_CHUNK_MAG
    #define HAVE_HALF_CHUNK
    #define HAVE_MASKED_READWRITE
    #define HAVE_CHUNKCOPY
    #define HAVE_HALFCHUNKCOPY

    static inline halfmask_t gen_half_mask(size_t len) {
       return (halfmask_t)_bzhi_u32(0xFFFF, (unsigned)len);
    }

    static inline mask_t gen_mask(size_t len) {
       return (mask_t)_bzhi_u32(0xFFFFFFFF, (unsigned)len);
    }

    static inline void chunkmemset_2(uint8_t *from, chunk_t *chunk) {
        *chunk = _mm256_set1_epi16(zng_memread_2(from));
    }

    static inline void chunkmemset_4(uint8_t *from, chunk_t *chunk) {
        *chunk = _mm256_set1_epi32(zng_memread_4(from));
    }
