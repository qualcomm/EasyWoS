- id: ISSUE-0026
  file: arch/x86/slide_hash_avx2.c
  code_range: 20-46
  category: x64_neon_port_required
  arm64_target: slide_hash_neon
  arm64_file: arch/arm/slide_hash_neon.c
  description: "AVX2 hash chain slide function (no AVX512 equivalent exists). Must be ported to slide_hash_neon.\nIterates\
    \ over head and prev arrays in 32-entry (64-byte) blocks,\nsubtracting wsize from each uint16_t entry with unsigned saturation.\n\
    Key intrinsic mappings:\n  _mm256_set1_epi16  -> vdupq_n_u16\n  _mm256_load_si256  -> vld1q_u16 x2 (two 128-bit loads\
    \ per 256-bit block)\n  _mm256_subs_epu16  -> vqsubq_u16\n  _mm256_store_si256 -> vst1q_u16 x2"
  context: "static inline void slide_hash_chain(Pos *table, uint32_t entries, const __m256i wsize) {\n    table += entries;\n\
    \    table -= 32;\n\n    do {\n        __m256i value1, value2, result1, result2;\n\n        value1 = _mm256_load_si256((__m256i\
    \ *)table);\n        value2 = _mm256_load_si256((__m256i *)(table+16));\n        result1 = _mm256_subs_epu16(value1, wsize);\n\
    \        result2 = _mm256_subs_epu16(value2, wsize);\n        _mm256_store_si256((__m256i *)table, result1);\n       \
    \ _mm256_store_si256((__m256i *)(table+16), result2);\n\n        table -= 32;\n        entries -= 32;\n    } while (entries\
    \ > 0);\n}\n\nZ_INTERNAL void slide_hash_avx2(deflate_state *s) {\n    Assert(s->w_size <= UINT16_MAX, \"w_size should\
    \ fit in uint16_t\");\n    uint16_t wsize = (uint16_t)s->w_size;\n    const __m256i ymm_wsize = _mm256_set1_epi16((short)wsize);\n\
    \n    slide_hash_chain(s->head, HASH_SIZE, ymm_wsize);\n    slide_hash_chain(s->prev, wsize, ymm_wsize);\n}"
