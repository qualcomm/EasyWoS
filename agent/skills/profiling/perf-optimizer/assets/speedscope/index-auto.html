<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>speedscope</title>
    <link rel="stylesheet" href="speedscope-GHPHNKXC.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32-3EB2YCUY.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16-VSI62OPJ.png">
    <link rel="icon" type="image/x-icon" href="favicon-FOKUP5Y5.ico">
  </head>
  <body>
    <script src="speedscope-Y2522XSH.js"></script>
    <script>
      // 自动加载 URL 参数中的 JSON 文件
      (function() {
        const params = new URLSearchParams(window.location.search);
        const jsonFile = params.get('file');

        if (jsonFile) {
          // 等待 speedscope 应用加载完成
          const checkApp = setInterval(() => {
            if (window.speedscope && window.speedscope.openFile) {
              clearInterval(checkApp);

              // 获取文件
              fetch(jsonFile)
                .then(response => {
                  if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                  return response.blob();
                })
                .then(blob => {
                  // 创建 File 对象
                  const file = new File([blob], jsonFile.split('/').pop(), { type: 'application/json' });
                  // 调用 speedscope 的打开文件方法
                  window.speedscope.openFile(file);
                })
                .catch(err => console.error('Failed to load file:', err));
            }
          }, 100);

          // 超时保护
          setTimeout(() => clearInterval(checkApp), 5000);
        }
      })();
    </script>
  </body>
</html>
